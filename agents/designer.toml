schema_version = "1.0"
id = "designer"
version = "1.2.1"
description = "Один проверенный план содержания, три варианта верстки, отдельный аудит."

[roles.story]
model = "qwen_3_8_27b"
task = "text"
prompt = "prompts/designer/story.md"
attempts = 3
timeout_seconds = 600

[roles.story.prompts]
correction = "prompts/designer/story_correction.md"
correction_patch = "prompts/designer/story_correction_patch.md"
correction_full = "prompts/designer/story_correction_full.md"
repair_requirements = "prompts/designer/story_repair_requirements.md"
editorial_repair = "prompts/designer/story_editorial_repair.md"

[roles.contextual_auditor]
model = "qwen_3_8_27b"
task = "image-to-text"
prompt = "prompts/designer/audit.md"
attempts = 2
timeout_seconds = 120
concurrency = 3
enabled_default = false

[roles.image_illustrator]
model = "z_image_turbo"
task = "text-to-image"
prompt = "prompts/designer/image.md"
attempts = 1
timeout_seconds = 90
enabled_default = false
inference_steps = 8
guidance_scale = 0.0
