[project]
name = "exposlides"
version = "0.1.0"
description = "Presentation parsing, content generation, and building services"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiobotocore>=3.9.0",
    "gigachat",
    "grpcio>=1.83.1",
    "grpcio-tools>=1.83.1",
    "langgraph",
    "lxml",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "python-pptx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
