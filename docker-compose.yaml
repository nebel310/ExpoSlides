  #   restart: unless-stopped

  frontend:
    image: caddy:2-alpine
    container_name: frontend
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - ./frontend/gateway:/srv/frontend:ro
      - ./deploy/local/CaddyFile:/etc/caddy/Caddyfile:ro
    depends_on:
      - gateway-service
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
  kafka_data:
  redis_data:
  caddy_data:
  caddy_config:
