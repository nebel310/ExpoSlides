services:
  postgres:
    image: postgres:16-alpine
    container_name: file-service-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  file-service:
    build:
      context: .
      dockerfile: services/file-service/Dockerfile
    container_name: file-service
    ports:
      - "127.0.0.1:${FILE_SERVICE_PORT:-50051}:50051"
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  parser-service:
    build:
      context: .
      dockerfile: services/parsing-service/Dockerfile
    container_name: parser-service
    ports:
      - "127.0.0.1:${PARSER_SERVICE_PORT:-50052}:50052"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: parser-service
      KAFKA_TOPIC_TASK_CREATED: task.created
      KAFKA_TOPIC_TASK_PARSED: task.parsed
      KAFKA_TOPIC_TASK_FAILED: task.failed
      FILE_SERVICE_GRPC_HOST: file-service
      FILE_SERVICE_GRPC_PORT: 50051
      PARSER_SERVICE_PORT: 50052
    depends_on:
      kafka:
        condition: service_healthy
      file-service:
        condition: service_started

  content-service:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    container_name: content-service
    ports:
      - "127.0.0.1:${CONTENT_SERVICE_PORT:-50053}:50053"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: content-service
      KAFKA_TOPIC_TASK_PARSED: task.parsed
      KAFKA_TOPIC_TASK_CONTENT_READY: task.content_ready
      KAFKA_TOPIC_TASK_CONTENT_RETRY: task.content_retry
      KAFKA_TOPIC_TASK_FAILED: task.failed
      FILE_SERVICE_GRPC_HOST: file-service
      FILE_SERVICE_GRPC_PORT: 50051
      CONTENT_SERVICE_PORT: 50053
      CONTENT_VALIDATION_RETRIES: ${CONTENT_VALIDATION_RETRIES}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_TIMEOUT: ${LLM_API_TIMEOUT}
      LLM_MODEL: ${LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS}
      LLM_RESPONSE_RETRIES: ${LLM_RESPONSE_RETRIES}
      LOG_LEVEL: ${LOG_LEVEL}
      LLM_STUB_MODE: ${LLM_STUB_MODE:-false}
    depends_on:
      kafka:
        condition: service_healthy
      file-service:
        condition: service_started

  builder-service:
    build:
      context: .
      dockerfile: services/builder-service/Dockerfile
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: builder-service
      KAFKA_TOPIC_TASK_CONTENT_READY: task.content_ready
      KAFKA_TOPIC_TASK_BUILT: task.built
      KAFKA_TOPIC_TASK_FAILED: task.failed
      FILE_SERVICE_GRPC_HOST: file-service
      FILE_SERVICE_GRPC_PORT: 50051
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
      file-service:
        condition: service_started

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_SERVICE_PORT:-1000}:1000"
    environment:
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-[]}
      COOKIE_SECURE: ${GATEWAY_COOKIE_SECURE:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GATEWAY_KAFKA_GROUP_ID: gateway-service
      KAFKA_TOPIC_TASK_CREATED: task.created
      KAFKA_TOPIC_TASK_PARSED: task.parsed
      KAFKA_TOPIC_TASK_CONTENT_READY: task.content_ready
      KAFKA_TOPIC_TASK_BUILT: task.built
      KAFKA_TOPIC_TASK_FAILED: task.failed
      FILE_SERVICE_GRPC_HOST: file-service
      FILE_SERVICE_GRPC_PORT: 50051
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE}
      GATEWAY_PORT: 1000
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      kafka:
        condition: service_healthy
      file-service:
        condition: service_started
      redis:
        condition: service_healthy

  # caddy: ЭТО НУЖНО ТОЛЬКО ДЛЯ ДЕПЛОЯ
  #   image: caddy:2-alpine
  #   container_name: caddy
  #   ports:
  #     - "80:80"
